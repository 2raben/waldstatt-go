[package]
name = "waldstatt-go"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Waldstatt Go: rivals fell their way through the forest and enclose each other"
publish = false

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "2d",
    "audio",
    "ui",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
