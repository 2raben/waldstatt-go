[package]
name = "waldstatt-go"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Waldstatt Go: rivals fell their way through the forest and enclose each other"
publish = false

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "2d",
    "audio",
    "ui",
] }
# Reads the Waldstatt's water pages compiled into the game (ADR 0004).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "=1.0.140"

# The browser build (`mise run web:build`) renders with WebGL2, which the `2d`
# feature set already includes (ADR 0005).
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["web"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The browser build: small, because the page downloads it on every visit.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
